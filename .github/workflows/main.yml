name: Market Snapshot

on:
  schedule:
    - cron: '30 3-12 * * 1-5'   # 9:00 AM to 6:00 PM IST (3:30-12:30 UTC) Mon-Fri
  workflow_dispatch:            # allows manual trigger from GitHub UI

jobs:
  scrape-and-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper

        run: python datascraper.py

      - name: Commit updated prev_levels.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prev_levels.json
          git diff --staged --quiet || git commit -m "EOD levels update $(date +'%Y-%m-%d')"
          git push
